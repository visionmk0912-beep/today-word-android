name: Build Android APK

on:
  push:
    branches: [ main, v7-build-2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact v7 standalone asset
        run: |
          cat v7payload/part01.txt v7payload/p2a.txt v7payload/p2a2.txt v7payload/p2b.txt v7payload/part03.txt v7payload/part04.txt v7payload/part05.txt | base64 -d > /tmp/v7.html.bz2
          bzip2 -tv /tmp/v7.html.bz2
          bunzip2 -c /tmp/v7.html.bz2 > app/src/main/assets/index.html
          test "$(wc -c < app/src/main/assets/index.html)" -eq 472466
          echo "v7 asset bytes: $(wc -c < app/src/main/assets/index.html)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signature and v7 contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          test "$(wc -c < /tmp/apk-index.html)" -eq 472466
          cmp -s /tmp/apk-index.html app/src/main/assets/index.html
          sha256sum "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk today-word-v7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: today-word-v7-apk
          path: today-word-v7.apk
          retention-days: 30
